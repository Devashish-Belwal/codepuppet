name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      NEXT_PUBLIC_API_HOST: https://codepuppet.dabelwal.online
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run --cwd packages/database generate

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Build workspace
        run: bun run build

  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            export PATH="$HOME/.bun/bin:$PATH"
            cd ~/codepuppet

            echo "==> Fetching latest changes from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Installing dependencies..."
            bun install

            echo "==> Generating Prisma client..."
            bun run --cwd packages/database generate

            echo "==> Running database migrations..."
            bun run db:migrate:deploy

            echo "==> Building production application..."
            bun run build

            echo "==> Reloading PM2 services..."
            pm2 reload ecosystem.config.cjs --update-env || pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            pm2 save

            echo "==> Deployment finished successfully!"
